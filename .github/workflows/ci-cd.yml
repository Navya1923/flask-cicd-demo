name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-cicd-demo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-cicd-demo:${{ github.sha }}
    deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Deploy container
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/flask-cicd-demo:latest
          docker stop app || true
          docker rm app || true
          docker run -d --name app -p 8080:5000 --restart unless-stopped ${{ secrets.DOCKERHUB_USERNAME }}/flask-cicd-demo:latest
          docker image prune -f

      - name: Smoke test
        run: |
          sleep 5
          curl --fail http://localhost:8080/health